
[package]
name = "codexia"
version.workspace = true
description = "A powerful IDE/GUI and Toolkit for Codex CLI + Claude code"
authors = ["milisp"]
license = "AGPL-3.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codexia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)', 'cfg(desktop)'] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Mobile is a remote control for a paired desktop: the frontend routes every
# call over HTTP (see src/services/apiAdapt), so the app there is a webview
# shell and needs only the plugins granted by capabilities/default.json.
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "devtools"] }
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
tauri-plugin-os = "2"
tauri-plugin-opener = { version = "2" }
tauri-plugin-log = { version = "2" }
tauri-plugin-deep-link = "2"
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# --- desktop-only: the agent backend and everything it drags in ---
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-shell = { version = "2" }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-process = { version = "2" }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-updater = { version = "2" }
tauri-plugin-screenshots = { version = "2.2.0" }

reqwest = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
thiserror = { workspace = true }
moka = { workspace = true }
tokio = { workspace = true }
env_logger = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
async-trait = { workspace = true }
zip = { workspace = true }
tempfile = { workspace = true }
serde_yaml = { workspace = true }
glob = { workspace = true }
tokio-cron-scheduler = { workspace = true }
anyhow = { workspace = true }
claude-agent-sdk-rs = { workspace = true }
codex-finder = { workspace = true }
codexia-automation = { workspace = true }
codexia-codex = { workspace = true }
codexia-acp = { workspace = true }
codexia-cc = { workspace = true }
codexia-db = { workspace = true }
codexia-git = { workspace = true }
codexia-shared = { workspace = true }
codexia-web = { path = "../web" }
which = { version = "6.0" }

gix = { workspace = true }
walkdir = { workspace = true }
agent-insights = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
portable-pty = { workspace = true }
ignore = { workspace = true }
nucleo = { workspace = true }
cpal = "0.15"
whisper-rs = "0.12"
sha2 = "0.10"

# --- mobile-only: pairing is done by scanning the desktop's QR code ---
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
encoding_rs = "0.8"
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-av-foundation = "0.3"
block2 = "0.6"

[dev-dependencies]
tokio-tungstenite = "0.24"
